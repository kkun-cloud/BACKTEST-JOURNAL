<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像圧縮ツール</title>
<style>
:root{--bg:#07090c;--s1:#0d1117;--border:#1c2535;--win:#00d97e;--loss:#ff3d5a;--neutral:#3d9ee8;--text:#dde4ed;--dim:#3d5068;--gold:#f0b400;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
.wrap{width:100%;max-width:560px;}
h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;margin-bottom:6px;}
.sub{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:32px;}
.card{background:var(--s1);border:1px solid var(--border);padding:20px 24px;margin-bottom:12px;}
.card-title{font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:12px;text-transform:uppercase;}
.card-name{font-size:16px;color:var(--text);margin-bottom:4px;}
.card-info{font-size:11px;color:var(--dim);margin-bottom:14px;}
.btn{width:100%;border:none;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;padding:12px;transition:opacity 0.2s;}
.btn.go{background:var(--neutral);color:#fff;}
.btn.done{background:var(--win);color:#000;}
.btn.empty{background:var(--border);color:var(--dim);cursor:default;}
.btn:hover:not(.empty):not(.done){opacity:0.85;}
.progress{margin-top:12px;display:none;}
.progress-bar-track{height:6px;background:var(--border);}
.progress-bar-fill{height:100%;background:var(--win);width:0%;transition:width 0.3s;}
.progress-text{font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:1px;}
.result{margin-top:10px;font-size:11px;display:none;}
.result.success{color:var(--win);}
.result.error{color:var(--loss);}
.size-info{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:8px;}
.size-val{color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <h1>画像圧縮ツール</h1>
  <div class="sub">既存の記録データの画像を圧縮してlocalStorageの容量を解放します</div>

  <div class="card" id="card-trade">
    <div class="card-title">対象データ 01</div>
    <div class="card-name">Trade Journal</div>
    <div class="card-info" id="info-trade">確認中...</div>
    <div class="size-info">
      <span>現在の使用量</span>
      <span class="size-val" id="size-trade">—</span>
    </div>
    <button class="btn go" id="btn-trade" onclick="compress('tj_v3', 'trade')">圧縮する</button>
    <div class="progress" id="prog-trade">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="fill-trade"></div></div>
      <div class="progress-text" id="ptxt-trade">処理中...</div>
    </div>
    <div class="result" id="result-trade"></div>
  </div>

  <div class="card" id="card-backtest">
    <div class="card-title">対象データ 02</div>
    <div class="card-name">Backtest Journal</div>
    <div class="card-info" id="info-backtest">確認中...</div>
    <div class="size-info">
      <span>現在の使用量</span>
      <span class="size-val" id="size-backtest">—</span>
    </div>
    <button class="btn go" id="btn-backtest" onclick="compress('backtest_journal_v1', 'backtest')">圧縮する</button>
    <div class="progress" id="prog-backtest">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="fill-backtest"></div></div>
      <div class="progress-text" id="ptxt-backtest">処理中...</div>
    </div>
    <div class="result" id="result-backtest"></div>
  </div>
</div>

<script>
function getSize(key){
  const val = localStorage.getItem(key);
  if(!val) return 0;
  return new Blob([val]).size;
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}

function init(){
  const keys = [['tj_v3','trade'],['backtest_journal_v1','backtest']];
  keys.forEach(([key, id])=>{
    const raw = localStorage.getItem(key);
    const infoEl = document.getElementById('info-'+id);
    const sizeEl = document.getElementById('size-'+id);
    const btnEl = document.getElementById('btn-'+id);
    if(!raw){
      infoEl.textContent = 'データなし';
      btnEl.className = 'btn empty';
      btnEl.textContent = 'データなし';
      sizeEl.textContent = '0 KB';
      return;
    }
    const data = JSON.parse(raw);
    const withImg = data.filter(r=>r.img).length;
    infoEl.textContent = `${data.length}件の記録 / 画像あり ${withImg}件`;
    sizeEl.textContent = formatSize(getSize(key));
    if(withImg === 0){
      btnEl.className = 'btn empty';
      btnEl.textContent = '画像なし（圧縮不要）';
    }
  });
}

function compressImgData(dataUrl, maxW, maxH, quality){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(dataUrl); // keep original on error
    img.src = dataUrl;
  });
}

async function compress(key, id){
  const raw = localStorage.getItem(key);
  if(!raw) return;
  const data = JSON.parse(raw);
  const btn = document.getElementById('btn-'+id);
  const prog = document.getElementById('prog-'+id);
  const fill = document.getElementById('fill-'+id);
  const ptxt = document.getElementById('ptxt-'+id);
  const result = document.getElementById('result-'+id);
  const sizeEl = document.getElementById('size-'+id);

  btn.style.display='none';
  prog.style.display='block';

  const beforeSize = getSize(key);
  let processed = 0;
  const withImg = data.filter(r=>r.img);
  const total = withImg.length;

  for(let i=0; i<data.length; i++){
    if(data[i].img){
      // Skip if already compressed (small size)
      const imgSize = new Blob([data[i].img]).size;
      if(imgSize > 50*1024){ // only compress if > 50KB
        data[i].img = await compressImgData(data[i].img, 1200, 900, 0.72);
      }
      processed++;
      const pct = Math.round(processed/total*100);
      fill.style.width = pct+'%';
      ptxt.textContent = `${processed} / ${total} 件処理中...`;
    }
  }

  try{
    localStorage.setItem(key, JSON.stringify(data));
    const afterSize = getSize(key);
    const saved = beforeSize - afterSize;
    result.style.display='block';
    result.className='result success';
    result.textContent = `✓ 完了 — ${formatSize(beforeSize)} → ${formatSize(afterSize)}（${formatSize(saved)} 解放）`;
    sizeEl.textContent = formatSize(afterSize);
    btn.style.display='block';
    btn.className='btn done';
    btn.textContent='✓ 圧縮完了';
    btn.onclick=null;
  } catch(e){
    result.style.display='block';
    result.className='result error';
    result.textContent='エラー: ' + e.message;
    btn.style.display='block';
  }
  prog.style.display='none';
}

init();
</script>
</body>
</html>
