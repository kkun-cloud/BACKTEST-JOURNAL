<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過去検証ジャーナル</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c;
  --s1: #0d1117;
  --s2: #111820;
  --border: #1c2535;
  --border2: #243040;
  --win: #00d97e;
  --win-dim: rgba(0,217,126,0.1);
  --loss: #ff3d5a;
  --loss-dim: rgba(255,61,90,0.1);
  --neutral: #3d9ee8;
  --text: #dde4ed;
  --dim: #3d5068;
  --dim2: #1e2d3d;
  --gold: #f0b400;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-weight:300;min-height:100vh;}

/* Grid bg */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle at 20% 50%, rgba(61,158,232,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(0,217,126,0.03) 0%, transparent 40%),
    repeating-linear-gradient(0deg,transparent,transparent 56px,rgba(255,255,255,0.018) 56px,rgba(255,255,255,0.018) 57px),
    repeating-linear-gradient(90deg,transparent,transparent 56px,rgba(255,255,255,0.018) 56px,rgba(255,255,255,0.018) 57px);
  pointer-events:none;z-index:0;
}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(7,9,12,0.96);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:58px;
}
.nav-left{display:flex;align-items:center;gap:16px;}
.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:var(--text);}
.nav-badge{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;
  border:1px solid var(--dim);color:var(--dim);padding:3px 8px;
}
.nav-tabs{display:flex;gap:2px;}
.tab-btn{
  background:none;border:none;cursor:pointer;
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);padding:7px 16px;border-bottom:2px solid transparent;transition:all 0.2s;
}
.tab-btn.active{color:var(--text);border-bottom-color:var(--neutral);}
.tab-btn:hover{color:var(--text);}

/* MAIN */
.main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:36px 24px;}

/* VIEWS */
.view{display:none;}
.view.active{display:block;}

/* ===== RECORD ===== */
.page-header{margin-bottom:32px;}
.page-header h2{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;color:var(--text);margin-bottom:4px;}
.page-header p{font-size:12px;color:var(--dim);letter-spacing:1px;}

/* Result toggle */
.result-toggle{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:24px;border:1px solid var(--border);}
.rt-btn{
  background:none;border:none;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;
  padding:16px;transition:all 0.2s;color:var(--dim);
}
.rt-btn.win.active{background:var(--win-dim);color:var(--win);border-bottom:2px solid var(--win);}
.rt-btn.loss.active{background:var(--loss-dim);color:var(--loss);border-bottom:2px solid var(--loss);}
.rt-btn:not(.active):hover{color:var(--text);}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-full{grid-column:1/-1;}
.field label{
  display:block;font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:5px;
}
.field input,.field select,.field textarea{
  width:100%;background:var(--s1);border:1px solid var(--border);
  color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px;
  padding:10px 12px;outline:none;transition:border-color 0.2s;appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--neutral);}
.field textarea{resize:vertical;min-height:70px;font-family:'Noto Sans JP',sans-serif;font-size:12px;line-height:1.6;}
.field select option{background:#0d1117;}

/* Condition checklist */
.cond-section{margin-bottom:10px;}
.cond-title{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;
  color:var(--dim);text-transform:uppercase;margin-bottom:8px;
}
.cond-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;}
.cond-item{
  display:flex;align-items:center;gap:8px;
  background:var(--s1);border:1px solid var(--border);
  padding:8px 10px;cursor:pointer;transition:all 0.15s;
  font-size:12px;color:var(--dim);
}
.cond-item:hover{border-color:var(--dim);color:var(--text);}
.cond-item.checked.win-cond{border-color:var(--win);color:var(--win);background:var(--win-dim);}
.cond-item.checked.loss-cond{border-color:var(--loss);color:var(--loss);background:var(--loss-dim);}
.cond-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background 0.15s;}
.cond-item.checked.win-cond .cond-dot{background:var(--win);}
.cond-item.checked.loss-cond .cond-dot{background:var(--loss);}

/* Image upload */
.img-upload-area{
  border:1px dashed var(--border2);background:var(--s1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;cursor:pointer;transition:all 0.2s;min-height:100px;position:relative;
}
.img-upload-area:hover{border-color:var(--neutral);}
.img-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.img-upload-area .iu-icon{font-size:24px;margin-bottom:8px;opacity:0.4;}
.img-upload-area .iu-text{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--dim);}
.img-preview{width:100%;max-height:360px;object-fit:contain;background:#000;display:none;margin-top:10px;}

/* RR score */
.rr-display{
  font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;
  color:var(--neutral);text-align:center;padding:10px 0 0;
}
.rr-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);text-align:center;margin-bottom:6px;}

/* Submit */
.submit-btn{
  width:100%;border:none;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;
  padding:14px;margin-top:14px;transition:opacity 0.2s;
}
.submit-btn.win-btn{background:var(--win);color:#000;}
.submit-btn.loss-btn{background:var(--loss);color:#fff;}
.submit-btn:hover{opacity:0.85;}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;
  padding:12px 20px;transform:translateY(80px);opacity:0;transition:all 0.3s;
}
.toast.win-toast{background:var(--win);color:#000;}
.toast.loss-toast{background:var(--loss);color:#fff;}
.toast.show{transform:translateY(0);opacity:1;}

/* ===== ANALYSIS ===== */
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:28px;}
.sum-box{background:var(--s1);border:1px solid var(--border);padding:14px 16px;}
.sum-box .sl{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--dim);margin-bottom:4px;}
.sum-box .sv{font-family:'Share Tech Mono',monospace;font-size:18px;font-weight:700;}
.sv.pos{color:var(--win);}
.sv.neg{color:var(--loss);}
.sv.neu{color:var(--neutral);}
.sv.gold{color:var(--gold);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}

.analysis-card{background:var(--s1);border:1px solid var(--border);padding:18px 20px;}
.ac-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:14px;text-transform:uppercase;}

.cond-bar-row{margin-bottom:8px;}
.cbr-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.cbr-label{color:var(--text);}
.cbr-stat{font-family:'Share Tech Mono',monospace;color:var(--dim);}
.cbr-track{height:4px;background:var(--dim2);}
.cbr-fill{height:100%;transition:width 0.5s ease;}
.cbr-fill.win-fill{background:var(--win);}
.cbr-fill.loss-fill{background:var(--loss);}

.equity-wrap{margin-bottom:24px;}
.equity-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:12px;text-transform:uppercase;}
canvas{width:100%!important;background:var(--s1);border:1px solid var(--border);}

/* ===== LIST ===== */
.list-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;}
.filter-group{display:flex;gap:6px;}
.filter-btn{
  background:var(--s1);border:1px solid var(--border);
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;
  color:var(--dim);padding:6px 12px;cursor:pointer;transition:all 0.15s;
}
.filter-btn.active{border-color:var(--neutral);color:var(--neutral);}
.filter-btn.win-f.active{border-color:var(--win);color:var(--win);}
.filter-btn.loss-f.active{border-color:var(--loss);color:var(--loss);}

.clear-btn{background:none;border:1px solid var(--dim2);color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;padding:6px 12px;cursor:pointer;transition:all 0.2s;}
.clear-btn:hover{border-color:var(--loss);color:var(--loss);}

.trade-list{display:flex;flex-direction:column;gap:6px;}

.tc{
  background:var(--s1);border:1px solid var(--border);
  border-left:3px solid var(--tc-color, var(--border));
  overflow:hidden;cursor:pointer;transition:border-color 0.15s;
}
.tc:hover{border-color:var(--tc-color);}
.tc-main{
  display:grid;grid-template-columns:130px 70px 80px 80px 1fr auto;
  gap:10px;align-items:center;padding:12px 16px;
}
.tc-date{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);line-height:1.5;}
.tc-result{font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:700;}
.tc-result.win{color:var(--win);}
.tc-result.loss{color:var(--loss);}
.tc-usd{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);}
.tc-rr{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--neutral);}
.tc-memo{font-size:11px;color:#6a7f94;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-del{background:none;border:none;color:var(--dim2);font-size:13px;cursor:pointer;padding:4px;transition:color 0.2s;}
.tc-del:hover{color:var(--loss);}

.tc-detail{
  display:none;padding:12px 16px;border-top:1px solid var(--border);
  background:var(--bg);
}
.tc-detail.open{display:block;}
.tc-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.td-section-title{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;}
.td-tags{display:flex;flex-wrap:wrap;gap:5px;}
.td-tag{font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 8px;border:1px solid;}
.td-tag.win-tag{border-color:rgba(0,217,126,0.3);color:var(--win);}
.td-tag.loss-tag{border-color:rgba(255,61,90,0.3);color:var(--loss);}
.td-memo{font-size:11px;color:#6a7f94;line-height:1.6;}
.td-img{width:100%;max-height:400px;object-fit:contain;background:#000;margin-top:8px;border:1px solid var(--border);}


/* EDIT MODAL */
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--s1);border:1px solid var(--border);width:100%;max-width:640px;max-height:96vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:46px 20px 16px;border-bottom:1px solid var(--border);}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--text);}
.modal-close-btn{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px 8px;}
.modal-close-btn:hover{color:var(--loss);}
.modal-body{padding:20px;}
.modal-footer{padding:16px 20px 46px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.m-save{background:var(--neutral);border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;padding:10px 24px;cursor:pointer;}
.m-save:hover{opacity:0.85;}
.m-cancel{background:none;border:1px solid var(--dim);color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:10px 16px;cursor:pointer;}
.m-cancel:hover{border-color:var(--text);color:var(--text);}
.e-rt{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);margin-bottom:12px;}
.ertb2{background:none;border:none;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;padding:10px;transition:all 0.2s;color:var(--dim);}
.ertb2.win.active{background:var(--win-dim);color:var(--win);border-bottom:2px solid var(--win);}
.ertb2.loss.active{background:var(--loss-dim);color:var(--loss);border-bottom:2px solid var(--loss);}

.empty-state{text-align:center;padding:60px 20px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:2px;}

@media(max-width:640px){
  .form-grid{grid-template-columns:1fr;}
  .summary-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .tc-main{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
  .tc-memo{grid-column:1/-1;}
  .nav-badge{display:none;}
  .cond-grid{grid-template-columns:1fr;}
  .tc-detail-grid{grid-template-columns:1fr;}
}

/* IMAGE ADJUSTER */
.img-adjuster{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.97);display:none;flex-direction:column;}
.img-adjuster.open{display:flex;}
.adj-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,9,12,0.95);border-bottom:1px solid var(--border);flex-shrink:0;}
.adj-tools{display:flex;gap:6px;flex-wrap:wrap;}
.adj-btn{background:var(--s1);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:10px;padding:6px 12px;cursor:pointer;letter-spacing:1px;transition:all 0.15s;}
.adj-btn:hover{border-color:var(--neutral);color:var(--neutral);}
.adj-btn.primary{background:var(--win);border-color:var(--win);color:#000;font-weight:700;}
.adj-btn.primary:hover{opacity:0.85;}
.adj-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.adj-canvas-wrap img{max-width:90vw;max-height:80vh;object-fit:contain;transform-origin:center;cursor:grab;user-select:none;touch-action:none;}
.adj-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);white-space:nowrap;}

.adj-guide{position:absolute;pointer-events:none;border:2px solid rgba(61,158,232,0.8);box-shadow:0 0 0 9999px rgba(0,0,0,0.45);z-index:2;}
.adj-guide::before{content:'保存範囲';position:absolute;top:-22px;left:0;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--neutral);background:rgba(0,0,0,0.7);padding:2px 6px;}
.adj-corner{position:absolute;width:18px;height:18px;border-color:var(--neutral);border-style:solid;pointer-events:all;cursor:nwse-resize;z-index:3;}
.adj-corner.tl{top:-2px;left:-2px;border-width:3px 0 0 3px;cursor:nw-resize;}
.adj-corner.tr{top:-2px;right:-2px;border-width:3px 3px 0 0;cursor:ne-resize;}
.adj-corner.bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;cursor:sw-resize;}
.adj-corner.br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;cursor:se-resize;}
.adj-edge{position:absolute;pointer-events:all;z-index:3;}
.adj-edge.top{top:-4px;left:18px;right:18px;height:8px;cursor:n-resize;}
.adj-edge.bottom{bottom:-4px;left:18px;right:18px;height:8px;cursor:s-resize;}
.adj-edge.left{left:-4px;top:18px;bottom:18px;width:8px;cursor:w-resize;}
.adj-edge.right{right:-4px;top:18px;bottom:18px;width:8px;cursor:e-resize;}

</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <div class="nav-brand">BACKTEST</div>
    <div class="nav-badge">JOURNAL</div>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showView('record')">記録</button>
    <button class="tab-btn" onclick="showView('analysis')">分析</button>
    <button class="tab-btn" onclick="showView('list')">一覧</button>
  </div>
</nav>

<div class="main">

  <!-- ===== RECORD ===== -->
  <div id="view-record" class="view active">
    <div class="page-header">
      <h2>過去検証記録</h2>
      <p>勝ち・負け両方を記録して再現性を測る</p>
    </div>

    <div class="result-toggle">
      <button class="rt-btn win active" id="btn-win" onclick="setResult('win')">▲ WIN</button>
      <button class="rt-btn loss" id="btn-loss" onclick="setResult('loss')">▼ LOSS</button>
    </div>

    <div class="form-grid">
      <div class="field">
        <label>日時</label>
        <input type="datetime-local" id="f-date">
      </div>
      <div class="field">
        <label>銘柄 <span onclick="toggleBSymEdit()" style="cursor:pointer;color:var(--neutral);font-size:8px;letter-spacing:1px;margin-left:6px;">＋ 編集</span></label>
        <select id="f-symbol"></select>
        <div id="bsym-panel" style="display:none;margin-top:6px;">
          <div style="display:flex;gap:6px;">
            <input type="text" id="bsym-input" placeholder="例: GBPJPY" style="flex:1;background:var(--s1);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px 10px;outline:none;">
            <button onclick="addBSym()" style="background:var(--neutral);border:none;color:#000;font-family:'Share Tech Mono',monospace;font-size:11px;padding:8px 14px;cursor:pointer;">追加</button>
          </div>
          <div id="bsym-list" style="margin-top:6px;"></div>
        </div>
      </div>
      <div class="field">
        <label>pips</label>
        <input type="number" id="f-pips" placeholder="例: 23" oninput="calcRR()">
      </div>
      <div class="field">
        <label>$ (USD)</label>
        <input type="number" id="f-usd" placeholder="例: 340">
      </div>
      <div class="field">
        <label>リスク pips (SL幅)</label>
        <input type="number" id="f-sl" placeholder="例: 10" oninput="calcRR()">
      </div>
      <div class="field">
        <label>方向</label>
        <select id="f-dir">
          <option>Buy（ロング）</option>
          <option>Sell（ショート）</option>
        </select>
      </div>
      <div class="field">
        <label>50EMA実体確定</label>
        <select id="f-ema50">
          <option value="Yes">✅ 確定後エントリー</option>
          <option value="No">⚡ 途中でエントリー</option>
        </select>
      </div>
      <div class="field">
        <label>5分足バイアス</label>
        <select id="f-bias5">
          <option value="一致">一致（同方向）</option>
          <option value="不一致">不一致（逆方向）</option>
          <option value="中立">中立（レンジ）</option>
        </select>
      </div>
      <div class="field">
        <label>15分足バイアス</label>
        <select id="f-bias15">
          <option value="一致">一致（同方向）</option>
          <option value="不一致">不一致（逆方向）</option>
          <option value="中立">中立（レンジ）</option>
        </select>
      </div>
    </div>

    <div class="field form-full" style="margin-bottom:10px;">
      <div class="rr-label">RR RATIO</div>
      <div class="rr-display" id="rr-display">—</div>
    </div>

    <!-- Win conditions -->
    <div class="cond-section" id="win-conds">
      <div class="cond-title">勝ちパターン条件（満たしているものを選択）</div>
      <div class="cond-grid" id="win-cond-grid"></div>
    </div>

    <!-- Loss conditions -->
    <div class="cond-section" id="loss-conds" style="display:none;">
      <div class="cond-title">負けパターン原因（該当するものを選択）</div>
      <div class="cond-grid" id="loss-cond-grid"></div>
    </div>

    <div class="form-grid" style="margin-top:10px;">
      <div class="field form-full">
        <label>メモ・気づき</label>
        <textarea id="f-memo" placeholder="セットアップの状況、感情、学んだこと..."></textarea>
      </div>
      <div class="field form-full">
        <label>チャート画像（タップして追加）</label>
        <div class="img-upload-area" id="img-area">
          <input type="file" accept="image/*" id="f-img" onchange="previewImg()">
          <div class="iu-icon">📊</div>
          <div class="iu-text">チャート画像を追加</div>
          <img class="img-preview" id="img-preview">
        </div>
      </div>
    </div>

    <button class="submit-btn win-btn" id="submit-btn" onclick="saveRecord()">WIN を記録する</button>
  </div>

  <!-- ===== ANALYSIS ===== -->
  <div id="view-analysis" class="view">
    <div class="page-header">
      <h2>検証分析</h2>
      <p id="a-subtitle">記録なし</p>
    </div>

    <div class="summary-grid">
      <div class="sum-box"><div class="sl">勝率</div><div class="sv gold" id="a-wr">—</div></div>
      <div class="sum-box"><div class="sl">平均RR</div><div class="sv neu" id="a-rr">—</div></div>
      <div class="sum-box"><div class="sl">総利益 $</div><div class="sv pos" id="a-profit">—</div></div>
      <div class="sum-box"><div class="sl">総損失 $</div><div class="sv neg" id="a-loss">—</div></div>
      <div class="sum-box"><div class="sl">純損益 $</div><div class="sv" id="a-net">—</div></div>
    </div>

    <div class="equity-wrap">
      <div class="equity-title">累積損益カーブ</div>
      <canvas id="equity-chart" height="120"></canvas>
    </div>

    <div class="two-col">
      <div class="analysis-card">
        <div class="ac-title">勝ちパターン条件 達成率</div>
        <div id="win-cond-bars"></div>
      </div>
      <div class="analysis-card">
        <div class="ac-title">負けパターン原因 頻度</div>
        <div id="loss-cond-bars"></div>
      </div>

  <!-- ===== LIST ===== -->

    <div class="list-controls">
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('all',this)">ALL</button>
        <button class="filter-btn win-f" onclick="setFilter('win',this)">WIN</button>
        <button class="filter-btn loss-f" onclick="setFilter('loss',this)">LOSS</button>
      </div>

    </div>
    <div class="trade-list" id="trade-list"></div>
  </div>

</div>

<div class="toast" id="toast">✓ 記録しました</div>

<script>
const STORAGE_KEY = 'backtest_journal_v1';
const WIN_CONDITIONS = [
  '蓄積あり（Sweep前にレンジ）','前足の質：実体>ヒゲ・長いヒゲなし','Sweep（流動性狩り）あり','包み足あり（Sweep後）','Sweep直後 × EMAクロスあり','有利な価格でエントリー（待てた）','BOS確定','EMA実体抜け',
  '流動性後の反応が強い','バイアス一致','ニュースなし',
  'ボリュームあり','上下に強いゾーンなし','20pips以上の余地','リテスト後エントリー'
];
const LOSS_CONDITIONS = [
  'ニュース中/前後','ボリューム弱い',
  '強いゾーンが近くにある','利幅20pips未満','流動性後に否定',
  'レンジ内','EMAヒゲ抜けのみ','BOS前エントリー','違和感→強行'
];

let currentResult = 'win';
let currentFilter = 'all';
let imgDataUrl = null;

// ---- Symbol Management ----
const BSYM_KEY = 'backtest_symbols';
const BSYM_DEFAULT = ['NASDAQ / MNQ','USDJPY','XAUUSD','GBPUSD','Other'];

function loadBSyms(){ try{return JSON.parse(localStorage.getItem(BSYM_KEY))||[...BSYM_DEFAULT];}catch{return[...BSYM_DEFAULT];} }
function saveBSyms(s){ localStorage.setItem(BSYM_KEY, JSON.stringify(s)); }
function renderBSymSelect(){
  const syms = loadBSyms();
  const sel = document.getElementById('f-symbol');
  const cur = sel.value;
  sel.innerHTML = syms.map(s=>`<option>${s}</option>`).join('');
  if(cur && syms.includes(cur)) sel.value = cur;
}
function renderBSymList(){
  const syms = loadBSyms();
  document.getElementById('bsym-list').innerHTML = syms.map((s,i) =>
    `<div style="display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--s1);border:1px solid var(--border);margin-bottom:4px;">
      <span style="flex:1;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text);">${s}</span>
      <button onclick="editBSym(${i})" style="background:none;border:1px solid var(--dim);color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 8px;cursor:pointer;letter-spacing:1px;">編集</button>
      <button onclick="delBSym(${i})" style="background:none;border:1px solid var(--loss);color:var(--loss);font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 8px;cursor:pointer;letter-spacing:1px;">削除</button>
    </div>`).join('');
}
function toggleBSymEdit(){
  const p = document.getElementById('bsym-panel');
  const open = p.style.display === 'none';
  p.style.display = open ? 'block' : 'none';
  if(open) renderBSymList();
}
function addBSym(){
  const inp = document.getElementById('bsym-input');
  const val = inp.value.trim().toUpperCase();
  if(!val) return;
  const syms = loadBSyms();
  if(syms.includes(val)){ alert('すでに登録されています'); inp.value=''; return; }
  syms.push(val);
  saveBSyms(syms);
  inp.value = '';
  renderBSymSelect();
  renderBSymList();
}
function editBSym(i){
  const syms = loadBSyms();
  const val = prompt('銘柄名を編集', syms[i]);
  if(!val || !val.trim()) return;
  const newVal = val.trim().toUpperCase();
  if(syms.includes(newVal) && syms[i] !== newVal){ alert('すでに登録されています'); return; }
  syms[i] = newVal;
  saveBSyms(syms);
  renderBSymSelect();
  renderBSymList();
}
function delBSym(i){
  const syms = loadBSyms();
  if(syms.length <= 1){ alert('最低1つは必要です'); return; }
  if(!confirm(`「${syms[i]}」を削除しますか？`)) return;
  syms.splice(i,1);
  saveBSyms(syms);
  renderBSymSelect();
  renderBSymList();
}

// ---- Init ----
(function init(){
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('f-date').value = now.toISOString().slice(0,16);
  renderBSymSelect();
  buildCondGrid('win-cond-grid', WIN_CONDITIONS, 'win-cond');
  buildCondGrid('loss-cond-grid', LOSS_CONDITIONS, 'loss-cond');
})();

function buildCondGrid(id, items, cls){
  const g = document.getElementById(id);
  g.innerHTML = items.map((c,i) => `
    <div class="cond-item ${cls}" onclick="toggleCond(this)" data-val="${c}">
      <div class="cond-dot"></div>${c}
    </div>`).join('');
}

function toggleCond(el){
  el.classList.toggle('checked');
}

// ---- Result toggle ----
function setResult(r){
  currentResult = r;
  document.getElementById('btn-win').classList.toggle('active', r==='win');
  document.getElementById('btn-loss').classList.toggle('active', r==='loss');
  document.getElementById('win-conds').style.display = r==='win'?'block':'none';
  document.getElementById('loss-conds').style.display = r==='loss'?'block':'none';
  const btn = document.getElementById('submit-btn');
  btn.textContent = r==='win' ? 'WIN を記録する' : 'LOSS を記録する';
  btn.className = 'submit-btn ' + (r==='win'?'win-btn':'loss-btn');
}

// ---- RR calc ----
function calcRR(){
  const pips = parseFloat(document.getElementById('f-pips').value);
  const sl = parseFloat(document.getElementById('f-sl').value);
  const el = document.getElementById('rr-display');
  if(pips && sl && sl > 0){
    el.textContent = (pips/sl).toFixed(2) + 'R';
    el.style.color = (pips/sl >= 2) ? 'var(--win)' : (pips/sl >= 1) ? 'var(--gold)' : 'var(--loss)';
  } else {
    el.textContent = '—';
    el.style.color = 'var(--neutral)';
  }
}


// ---- Image compression ----
function compressImg(dataUrl, maxW, maxH, quality, callback){
  const img = new Image();
  img.onload = function(){
    let w = img.width, h = img.height;
    if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
    if(h > maxH){ w = Math.round(w * maxH / h); h = maxH; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}
// ---- Image ----
function previewImg(){
  const file = document.getElementById('f-img').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    openAdj(e.target.result, result=>{
      imgDataUrl = result;
      const prev = document.getElementById('img-preview');
      prev.src = result;
      prev.style.display = 'block';
      document.querySelector('.iu-icon').style.display='none';
      document.querySelector('.iu-text').style.display='none';
    });
  };
  reader.readAsDataURL(file);
}

// ---- Save ----
function saveRecord(){
  const pips = parseFloat(document.getElementById('f-pips').value);
  const usd = parseFloat(document.getElementById('f-usd').value);
  if(!pips || !usd){ alert('pipsと$を入力してください'); return; }

  const sl = parseFloat(document.getElementById('f-sl').value) || null;
  const rr = (pips && sl) ? parseFloat((pips/sl).toFixed(2)) : null;

  const condClass = currentResult==='win' ? '.win-cond.checked' : '.loss-cond.checked';
  const conds = [...document.querySelectorAll(condClass)].map(el => el.dataset.val);

  const record = {
    id: Date.now(),
    date: document.getElementById('f-date').value,
    symbol: document.getElementById('f-symbol').value,
    result: currentResult,
    pips, usd, sl, rr,
    dir: document.getElementById('f-dir').value,
    ema50: document.getElementById('f-ema50').value,
    bias5: document.getElementById('f-bias5').value,
    bias15: document.getElementById('f-bias15').value,
    conditions: conds,
    memo: document.getElementById('f-memo').value.trim(),
    img: imgDataUrl
  };

  const data = loadData();
  data.unshift(record);
  saveData(data);

  // Reset
  document.getElementById('f-pips').value='';
  document.getElementById('f-usd').value='';
  document.getElementById('f-sl').value='';
  document.getElementById('f-ema50').value='Yes';
  document.getElementById('f-bias5').value='一致';
  document.getElementById('f-bias15').value='一致';
  document.getElementById('f-memo').value='';
  document.getElementById('rr-display').textContent='—';
  document.querySelectorAll('.cond-item').forEach(el=>el.classList.remove('checked'));
  imgDataUrl=null;
  document.getElementById('img-preview').style.display='none';
  document.getElementById('img-preview').src='';
  document.querySelector('.iu-icon').style.display='';
  document.querySelector('.iu-text').style.display='';

  showToast(currentResult);
}

// ---- Storage ----
function loadData(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch{ return []; }
}
function saveData(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

function showToast(type){
  const t = document.getElementById('toast');
  t.textContent = type==='win' ? '▲ WIN 記録しました' : '▼ LOSS 記録しました';
  t.className = 'toast '+(type==='win'?'win-toast':'loss-toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ---- Views ----
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab-btn')[['record','analysis','list'].indexOf(v)].classList.add('active');
  if(v==='analysis') renderAnalysis();
  if(v==='list') renderList();
}

// ---- Analysis ----
function renderAnalysis(){
  const data = loadData();
  if(!data.length){
    document.getElementById('a-subtitle').textContent='記録なし';
    ['a-wr','a-rr','a-profit','a-loss','a-net'].forEach(id=>document.getElementById(id).textContent='—');
    document.getElementById('win-cond-bars').innerHTML='';
    document.getElementById('loss-cond-bars').innerHTML='';
    drawEquity([]);
    return;
  }
  const wins = data.filter(r=>r.result==='win');
  const losses = data.filter(r=>r.result==='loss');
  const wr = Math.round(wins.length/data.length*100);
  const avgRR = wins.filter(r=>r.rr).length
    ? (wins.filter(r=>r.rr).reduce((s,r)=>s+r.rr,0)/wins.filter(r=>r.rr).length).toFixed(2)
    : '—';
  const totalProfit = wins.reduce((s,r)=>s+r.usd,0);
  const totalLoss = losses.reduce((s,r)=>s+r.usd,0);
  const net = totalProfit - totalLoss;

  document.getElementById('a-subtitle').textContent = `${data.length}件の記録 / ${wins.length}勝 ${losses.length}敗`;
  document.getElementById('a-wr').textContent = wr+'%';
  document.getElementById('a-rr').textContent = avgRR==='—'?'—':avgRR+'R';
  document.getElementById('a-profit').textContent = '+$'+totalProfit.toLocaleString();
  document.getElementById('a-loss').textContent = '-$'+totalLoss.toLocaleString();
  const netEl = document.getElementById('a-net');
  netEl.textContent = (net>=0?'+':'') + '$'+net.toLocaleString();
  netEl.className = 'sv '+(net>=0?'pos':'neg');

  // Condition bars
  const wcBars = document.getElementById('win-cond-bars');
  const lcBars = document.getElementById('loss-cond-bars');
  wcBars.innerHTML=''; lcBars.innerHTML='';

  WIN_CONDITIONS.forEach(cond=>{
    const cnt = wins.filter(r=>r.conditions&&r.conditions.includes(cond)).length;
    const pct = wins.length ? Math.round(cnt/wins.length*100) : 0;
    wcBars.innerHTML += barRow(cond, cnt, pct, 'win-fill', wins.length);
  });
  LOSS_CONDITIONS.forEach(cond=>{
    const cnt = losses.filter(r=>r.conditions&&r.conditions.includes(cond)).length;
    const pct = losses.length ? Math.round(cnt/losses.length*100) : 0;
    lcBars.innerHTML += barRow(cond, cnt, pct, 'loss-fill', losses.length);
  });

  // Equity curve
  const sorted = [...data].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let eq = 0;
  const points = sorted.map(r=>{
    eq += r.result==='win' ? r.usd : -r.usd;
    return eq;
  });
  drawEquity(points);
}

function barRow(label, cnt, pct, cls, total){
  return `<div class="cond-bar-row">
    <div class="cbr-top">
      <span class="cbr-label">${label}</span>
      <span class="cbr-stat">${cnt}/${total} (${pct}%)</span>
    </div>
    <div class="cbr-track"><div class="cbr-fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}

function drawEquity(points){
  const canvas = document.getElementById('equity-chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth || 900;
  canvas.height = 120;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!points.length){
    ctx.fillStyle='#3d5068';ctx.font='12px Share Tech Mono';
    ctx.fillText('データなし',canvas.width/2-30,60);
    return;
  }
  const pts = [0,...points];
  const min = Math.min(...pts), max = Math.max(...pts);
  const range = max-min || 1;
  const pad = 20;
  const w = canvas.width, h = canvas.height;
  const x = i => pad + (i/(pts.length-1))*(w-pad*2);
  const y = v => h-pad - ((v-min)/range)*(h-pad*2);

  // Zero line
  ctx.beginPath();
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.moveTo(pad,y(0));ctx.lineTo(w-pad,y(0));ctx.stroke();ctx.setLineDash([]);

  // Gradient fill
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, 'rgba(0,217,126,0.15)');
  grad.addColorStop(1, 'rgba(0,217,126,0)');
  ctx.beginPath();
  ctx.moveTo(x(0),y(pts[0]));
  pts.forEach((v,i)=>i>0&&ctx.lineTo(x(i),y(v)));
  ctx.lineTo(x(pts.length-1),h);ctx.lineTo(x(0),h);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle=pts[pts.length-1]>=0?'var(--win)':'var(--loss)';
  ctx.lineWidth=2;
  pts.forEach((v,i)=>i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v)));
  ctx.stroke();

  // Dots
  pts.forEach((v,i)=>{
    ctx.beginPath();
    ctx.arc(x(i),y(v),3,0,Math.PI*2);
    ctx.fillStyle=i===0?'var(--dim)':(points[i-1]>=0?'var(--win)':'var(--loss)');
    ctx.fill();
  });
}

// ---- List ----
function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(){
  const data = loadData().filter(r=>currentFilter==='all'||r.result===currentFilter);
  const list = document.getElementById('trade-list');
  if(!data.length){list.innerHTML='<div class="empty-state">記録がありません</div>';return;}
  list.innerHTML = data.map(r=>{
    const color = r.result==='win'?'var(--win)':'var(--loss)';
    const sign = r.result==='win'?'+':'-';
    const d = r.date?new Date(r.date).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
    const condTags = (r.conditions||[]).map(c=>`<span class="td-tag ${r.result}-tag">${c}</span>`).join('');
    const rrText = r.rr ? r.rr+'R' : '—';
    return `
      <div class="tc" style="--tc-color:${color}" onclick="toggleDetail(${r.id})">
        <div class="tc-main">
          <div class="tc-date">${d}<br>${r.symbol}</div>
          <div class="tc-result ${r.result}">${sign}${r.pips}p</div>
          <div class="tc-usd">${sign}$${r.usd}</div>
          <div class="tc-rr">${rrText}</div>
          <div class="tc-memo">${r.memo||'（メモなし）'}</div>
          <button class="tc-del" style="color:var(--neutral);margin-right:2px;" onclick="event.stopPropagation();openBEdit(${r.id})" title="編集">✎</button>
          <button class="tc-del" onclick="event.stopPropagation();deleteRecord(${r.id})" title="削除">✕</button>
        </div>
        <div class="tc-detail" id="detail-${r.id}">
          <div class="tc-detail-grid">
            <div>
              <div style="display:flex;gap:8px;margin-bottom:10px;">
              <span style="font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 10px;border:1px solid ${r.bias5==='一致'?'rgba(0,217,126,0.4)':r.bias5==='不一致'?'rgba(255,61,90,0.4)':'rgba(61,158,232,0.4)'};color:${r.bias5==='一致'?'var(--win)':r.bias5==='不一致'?'var(--loss)':'var(--neutral)'};">5分: ${r.bias5||'—'}</span>
              <span style="font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 10px;border:1px solid ${r.bias15==='一致'?'rgba(0,217,126,0.4)':r.bias15==='不一致'?'rgba(255,61,90,0.4)':'rgba(61,158,232,0.4)'};color:${r.bias15==='一致'?'var(--win)':r.bias15==='不一致'?'var(--loss)':'var(--neutral)'};">15分: ${r.bias15||'—'}</span>
            </div>
            <div class="td-section-title">${r.result==='win'?'達成条件':'負け原因'}</div>
              <div class="td-tags">${condTags||'<span style="font-size:11px;color:var(--dim)">記録なし</span>'}</div>
              ${r.memo?`<div style="margin-top:10px"><div class="td-section-title">メモ</div><div class="td-memo">${r.memo}</div></div>`:''}
            </div>
            <div>
              ${r.img?`<div class="td-section-title">チャート</div><img class="td-img" src="${r.img}">`:
              '<div style="font-size:11px;color:var(--dim)">画像なし</div>'}
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleDetail(id){
  const el = document.getElementById('detail-'+id);
  if(el) el.classList.toggle('open');
}

function deleteRecord(id){
  saveData(loadData().filter(r=>r.id!==id));
  renderList();
}

function clearAll(){
  if(!confirm('全記録を削除しますか？')) return;
  saveData([]); renderList();
}

let bEditId=null, bEditResult='win', bEditImgData=null;

function buildCondGrid2(id, items, cls){
  document.getElementById(id).innerHTML = items.map(c =>
    `<div class="cond-item ${cls}" onclick="this.classList.toggle('checked')" data-val="${c}" style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:8px 10px;cursor:pointer;font-size:12px;color:var(--dim);transition:all 0.15s;">
      <div style="width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0;"></div>${c}
    </div>`).join('');
}

function bEditImgPreview(){
  const file=document.getElementById('be-img-file').files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    openAdj(e.target.result, result=>{
      bEditImgData=result;
      document.getElementById('be-img-preview').src=result;
      document.getElementById('be-img-preview-wrap').style.display='block';
      document.getElementById('be-img-upload-area').style.display='none';
    });
  };
  reader.readAsDataURL(file);

function removeBEditImg(){
  bEditImgData='__REMOVE__';
  document.getElementById('be-img-preview-wrap').style.display='none';
  document.getElementById('be-img-upload-area').style.display='flex';
  document.getElementById('be-img-file').value='';
}
function openBEdit(id){
  const data = loadData();
  const r = data.find(x=>x.id===id);
  if(!r) return;
  bEditId = id;
  bEditResult = r.result;
  const sel = document.getElementById('be-symbol');
  const syms = loadBSyms();
  sel.innerHTML = syms.map(s=>`<option value="${s}">${s}</option>`).join('');
  sel.value = r.symbol||syms[0];
  document.getElementById('be-date').value = r.date||'';
  document.getElementById('be-pips').value = r.pips||'';
  document.getElementById('be-usd').value = r.usd||'';
  document.getElementById('be-sl').value = r.sl||'';
  document.getElementById('be-dir').value = r.dir||'Buy（ロング）';
  document.getElementById('be-ema50').value = r.ema50||'Yes';
  document.getElementById('be-bias5').value = r.bias5||'一致';
  document.getElementById('be-bias15').value = r.bias15||'一致';
  document.getElementById('be-memo').value = r.memo||'';
  bEditImgData=null;
  document.getElementById('be-img-file').value='';
  if(r.img){
    bEditImgData=r.img;
    document.getElementById('be-img-preview').src=r.img;
    document.getElementById('be-img-preview-wrap').style.display='block';
    document.getElementById('be-img-upload-area').style.display='none';
  } else {
    document.getElementById('be-img-preview-wrap').style.display='none';
    document.getElementById('be-img-upload-area').style.display='flex';
  }
  setBEditResult(r.result);
  buildCondGrid2('be-wcg', WIN_CONDITIONS, 'bewc');
  buildCondGrid2('be-lcg', LOSS_CONDITIONS, 'belc');
  (r.conditions||[]).forEach(c=>{
    const el = document.querySelector(`#be-wcg [data-val="${c}"], #be-lcg [data-val="${c}"]`);
    if(el) el.classList.add('checked');
  });
  calcBEditRR();
  document.getElementById('b-edit-modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeBEdit(){
  document.getElementById('b-edit-modal').classList.remove('open');
  document.body.style.overflow='';
  bEditId=null;
}

function setBEditResult(r){
  bEditResult=r;
  document.getElementById('bertb-win').classList.toggle('active',r==='win');
  document.getElementById('bertb-loss').classList.toggle('active',r==='loss');
  document.getElementById('be-wcs').style.display=r==='win'?'block':'none';
  document.getElementById('be-lcs').style.display=r==='loss'?'block':'none';
}

function calcBEditRR(){
  const p=parseFloat(document.getElementById('be-pips').value);
  const sl=parseFloat(document.getElementById('be-sl').value);
  const el=document.getElementById('be-rr');
  if(p&&sl&&sl>0){
    const rr=(p/sl).toFixed(2);
    el.textContent=rr+'R';
    el.style.color=parseFloat(rr)>=2?'var(--win)':parseFloat(rr)>=1?'var(--gold)':'var(--loss)';
  } else { el.textContent='—'; el.style.color='var(--neutral)'; }
}

function saveBEdit(){
  if(!bEditId) return;
  const p=parseFloat(document.getElementById('be-pips').value);
  const u=parseFloat(document.getElementById('be-usd').value);
  if(!p||!u){alert('pipsと$を入力してください');return;}
  const sl=parseFloat(document.getElementById('be-sl').value)||null;
  const rr=(p&&sl)?parseFloat((p/sl).toFixed(2)):null;
  const condSel=bEditResult==='win'?'.bewc.checked':'.belc.checked';
  const conds=[...document.querySelectorAll(condSel)].map(e=>e.dataset.val);
  const data=loadData();
  const idx=data.findIndex(x=>x.id===bEditId);
  if(idx===-1)return;
  const bNewImg = bEditImgData==='__REMOVE__' ? null : (bEditImgData || data[idx].img || null);
  data[idx]={
    ...data[idx],
    date:document.getElementById('be-date').value,
    symbol:document.getElementById('be-symbol').value,
    result:bEditResult,pips:p,usd:u,sl,rr,
    dir:document.getElementById('be-dir').value,
    ema50:document.getElementById('be-ema50').value,
    bias5:document.getElementById('be-bias5').value,
    bias15:document.getElementById('be-bias15').value,
    conditions:conds,
    memo:document.getElementById('be-memo').value.trim(),
    img:bNewImg
  };
  saveData(data);
  closeBEdit();
  renderList();
}

window.addEventListener('resize', ()=>{
  if(document.getElementById('view-analysis').classList.contains('active')) renderAnalysis();
});

// ---- Image Adjuster ----
let adjScale=1,adjX=0,adjY=0,adjDragging=false,adjDragX=0,adjDragY=0;
let adjCallback=null;

function openAdj(src, callback){
  adjCallback=callback;
  adjScale=1;adjX=0;adjY=0;
  const img=document.getElementById('adj-img');
  img.src=src;
  img.onload=()=>{ updateGuide(); };
  document.getElementById('img-adjuster').classList.add('open');
  document.body.style.overflow='hidden';
  setupAdjEvents();
  setTimeout(updateGuide, 100);
}
function updateGuide(){
  const wrap=document.getElementById('adj-wrap');
  const guide=document.getElementById('adj-guide');
  if(!wrap||!guide) return;
  const ww=wrap.offsetWidth, wh=wrap.offsetHeight;
  // Guide = 90% of wrap, centered, 16:9 aspect ratio capped
  const gw=Math.round(ww*0.88);
  const gh=Math.round(Math.min(wh*0.82, gw*0.65));
  const gx=Math.round((ww-gw)/2);
  const gy=Math.round((wh-gh)/2);
  guide.style.width=gw+'px';
  guide.style.height=gh+'px';
  guide.style.left=gx+'px';
  guide.style.top=gy+'px';
}
function closeAdj(){
  document.getElementById('img-adjuster').classList.remove('open');
  document.body.style.overflow='';
}
function adjZoom(f){adjScale=Math.min(Math.max(adjScale*f,0.2),8);applyAdj();}
function adjReset(){adjScale=1;adjX=0;adjY=0;applyAdj();}
function applyAdj(){
  document.getElementById('adj-img').style.transform=`translate(${adjX}px,${adjY}px) scale(${adjScale})`;
}
function confirmAdj(){
  const img=document.getElementById('adj-img');
  const wrap=document.getElementById('adj-wrap');
  const guide=document.getElementById('adj-guide');
  const wrapRect=wrap.getBoundingClientRect();
  const guideRect=guide.getBoundingClientRect();
  // Guide relative to wrap
  const gx=guideRect.left-wrapRect.left;
  const gy=guideRect.top-wrapRect.top;
  const gw=guideRect.width;
  const gh=guideRect.height;
  // Image display position
  const imgRect=img.getBoundingClientRect();
  const ix=imgRect.left-wrapRect.left;
  const iy=imgRect.top-wrapRect.top;
  const iw=imgRect.width;
  const ih=imgRect.height;
  // Crop in natural pixels
  const scaleX=img.naturalWidth/iw;
  const scaleY=img.naturalHeight/ih;
  const cropX=Math.max(0,(gx-ix)*scaleX);
  const cropY=Math.max(0,(gy-iy)*scaleY);
  const cropW=Math.min(img.naturalWidth-cropX, gw*scaleX);
  const cropH=Math.min(img.naturalHeight-cropY, gh*scaleY);
  const outW=Math.min(1200,Math.round(cropW));
  const outH=Math.max(1,Math.round(cropH*(outW/cropW)));
  const canvas=document.createElement('canvas');
  canvas.width=outW;canvas.height=outH;
  canvas.getContext('2d').drawImage(img,cropX,cropY,cropW,cropH,0,0,outW,outH);
  const result=canvas.toDataURL('image/jpeg',0.75);
  closeAdj();
  if(adjCallback)adjCallback(result);
}
function setupAdjEvents(){
  const img=document.getElementById('adj-img');
  const wrap=document.getElementById('adj-wrap');
  img.onmousedown=e=>{adjDragging=true;adjDragX=e.clientX-adjX;adjDragY=e.clientY-adjY;img.style.cursor='grabbing';e.preventDefault();};
  document.onmousemove=e=>{if(adjDragging){adjX=e.clientX-adjDragX;adjY=e.clientY-adjDragY;applyAdj();}};
  document.onmouseup=()=>{if(adjDragging){adjDragging=false;document.getElementById('adj-img').style.cursor='grab';}};
  wrap.onwheel=e=>{e.preventDefault();adjZoom(e.deltaY<0?1.1:0.9);};
  let ld=0;
  wrap.ontouchstart=e=>{
    if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    else if(e.touches.length===1){adjDragging=true;adjDragX=e.touches[0].clientX-adjX;adjDragY=e.touches[0].clientY-adjY;}
  };
  wrap.ontouchmove=e=>{
    e.preventDefault();
    if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(ld>0)adjZoom(d/ld);ld=d;}
    else if(e.touches.length===1&&adjDragging){adjX=e.touches[0].clientX-adjDragX;adjY=e.touches[0].clientY-adjDragY;applyAdj();}
  };
  wrap.ontouchend=()=>{adjDragging=false;ld=0;};
}


// ---- Guide resize ----
let resizing=false,resizeDir='',resizeStartX=0,resizeStartY=0;
let guideX=0,guideY=0,guideW=0,guideH=0;

function startResize(e,dir){
  e.preventDefault();e.stopPropagation();
  resizing=true;resizeDir=dir;
  resizeStartX=e.clientX;resizeStartY=e.clientY;
  const g=document.getElementById('adj-guide');
  guideX=parseInt(g.style.left);guideY=parseInt(g.style.top);
  guideW=parseInt(g.style.width);guideH=parseInt(g.style.height);
  document.onmousemove=onResizeMove;
  document.onmouseup=stopResize;
}
function startResizeT(e,dir){
  if(e.touches.length!==1)return;
  e.preventDefault();e.stopPropagation();
  resizing=true;resizeDir=dir;
  resizeStartX=e.touches[0].clientX;resizeStartY=e.touches[0].clientY;
  const g=document.getElementById('adj-guide');
  guideX=parseInt(g.style.left);guideY=parseInt(g.style.top);
  guideW=parseInt(g.style.width);guideH=parseInt(g.style.height);
  document.ontouchmove=onResizeMoveT;
  document.ontouchend=stopResize;
}
function onResizeMove(e){
  if(!resizing)return;
  doResize(e.clientX,e.clientY);
}
function onResizeMoveT(e){
  if(!resizing||!e.touches[0])return;
  doResize(e.touches[0].clientX,e.touches[0].clientY);
}
function doResize(cx,cy){
  const dx=cx-resizeStartX,dy=cy-resizeStartY;
  const wrap=document.getElementById('adj-wrap');
  const minS=40;
  let nx=guideX,ny=guideY,nw=guideW,nh=guideH;
  if(resizeDir.includes('r')){nw=Math.max(minS,guideW+dx);}
  if(resizeDir.includes('b')){nh=Math.max(minS,guideH+dy);}
  if(resizeDir.includes('l')){const d=Math.min(dx,guideW-minS);nx=guideX+d;nw=guideW-d;}
  if(resizeDir.includes('t')){const d=Math.min(dy,guideH-minS);ny=guideY+d;nh=guideH-d;}
  // clamp to wrap
  nx=Math.max(0,nx);ny=Math.max(0,ny);
  nw=Math.min(nw,wrap.offsetWidth-nx);
  nh=Math.min(nh,wrap.offsetHeight-ny);
  const g=document.getElementById('adj-guide');
  g.style.left=nx+'px';g.style.top=ny+'px';
  g.style.width=nw+'px';g.style.height=nh+'px';
}
function stopResize(){
  resizing=false;
  document.onmousemove=null;document.onmouseup=null;
  document.ontouchmove=null;document.ontouchend=null;
}

</script>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="b-edit-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">記録を編集</div>
      <button class="modal-close-btn" onclick="closeBEdit()">✕</button>
    </div>
    <div class="modal-body">
      <div class="e-rt">
        <button class="ertb2 win" id="bertb-win" onclick="setBEditResult('win')">▲ WIN</button>
        <button class="ertb2 loss" id="bertb-loss" onclick="setBEditResult('loss')">▼ LOSS</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div class="field"><label>日時</label><input type="datetime-local" id="be-date"></div>
        <div class="field"><label>銘柄</label><select id="be-symbol"></select></div>
        <div class="field"><label>pips</label><input type="number" id="be-pips" placeholder="例: 23" oninput="calcBEditRR()"></div>
        <div class="field"><label>$ (USD)</label><input type="number" id="be-usd" placeholder="例: 340"></div>
        <div class="field"><label>リスク pips (SL幅)</label><input type="number" id="be-sl" placeholder="例: 10" oninput="calcBEditRR()"></div>
        <div class="field"><label>方向</label><select id="be-dir"><option>Buy（ロング）</option><option>Sell（ショート）</option></select></div>
        <div class="field"><label>50EMA実体確定</label><select id="be-ema50"><option value="Yes">✅ 確定後エントリー</option><option value="No">⚡ 途中でエントリー</option></select></div>
        <div class="field"><label>5分足バイアス</label><select id="be-bias5"><option value="一致">一致</option><option value="不一致">不一致</option><option value="中立">中立</option></select></div>
        <div class="field"><label>15分足バイアス</label><select id="be-bias15"><option value="一致">一致</option><option value="不一致">不一致</option><option value="中立">中立</option></select></div>
      </div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;">RR Ratio</div>
      <div id="be-rr" style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--neutral);text-align:center;padding:4px 0;margin-bottom:12px;">—</div>
      <div id="be-wcs"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;">勝ちパターン条件</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;" id="be-wcg"></div></div>
      <div id="be-lcs"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;margin-top:10px;">負けパターン原因</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;" id="be-lcg"></div></div>
      <div class="field" style="margin-top:12px;grid-column:1/-1;">
        <label>メモ</label>
        <textarea id="be-memo" style="width:100%;min-height:60px;background:var(--s1);border:1px solid var(--border);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:10px 12px;outline:none;resize:vertical;"></textarea>
      </div>
      <div style="margin-top:12px;">
        <div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:6px;">チャート画像</div>
        <div id="be-img-preview-wrap" style="display:none;position:relative;margin-bottom:8px;">
          <img id="be-img-preview" style="width:100%;max-height:300px;object-fit:contain;background:#000;border:1px solid var(--border);cursor:pointer;">
          <button onclick="removeBEditImg()" style="position:absolute;top:6px;right:6px;background:rgba(7,9,12,0.85);border:1px solid var(--loss);color:var(--loss);font-family:'Share Tech Mono',monospace;font-size:10px;padding:3px 10px;cursor:pointer;">✕ 削除</button>
        </div>
        <div id="be-img-upload-area" style="background:var(--s1);border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:pointer;position:relative;min-height:70px;">
          <input type="file" accept="image/*" id="be-img-file" onchange="bEditImgPreview()" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;">
          <div style="font-size:18px;opacity:0.35;margin-bottom:4px;">📊</div>
          <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);">タップして変更</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="m-cancel" onclick="closeBEdit()">キャンセル</button>
      <button class="m-save" onclick="saveBEdit()">保存する</button>
    </div>
  </div>
</div>

      <button class="adj-btn" onclick="adjZoom(0.8)">－ 縮小</button>

  <div class="adj-canvas-wrap" id="adj-wrap">

      <div class="adj-corner tl" onmousedown="startResize(event,'tl')" ontouchstart="startResizeT(event,'tl')"></div>
      <div class="adj-corner tr" onmousedown="startResize(event,'tr')" ontouchstart="startResizeT(event,'tr')"></div>
